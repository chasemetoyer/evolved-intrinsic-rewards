[project]
name = "evolved-intrinsic-rewards"
version = "0.1.0"
description = "Stage 1 infrastructure and task calibration for generic intrinsic rewards"
requires-python = ">=3.11,<3.12"
dependencies = [
    "gymnasium==1.4.0",
    "minigrid==3.2.0",
    "modal==1.6.3",
    "numpy==2.4.6",
    "pytest==9.2.0",
    "scipy==1.17.1",
    "tomli-w==1.2.0",
    "torch==2.14.1",
    "trackio==0.43.0",
]

[tool.uv]
package = false

# CPU-only torch on Linux: MiniGrid PPO is env-bound, and this keeps remote installs small.
[tool.uv.sources]
torch = [{ index = "pytorch-cpu", marker = "sys_platform == 'linux'" }]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
